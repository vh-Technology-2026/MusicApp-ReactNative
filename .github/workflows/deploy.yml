name: CI/CD Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'Frontend/**'
              - '.github/workflows/**'
            backend:
              - 'Backend/**'
              - '.github/workflows/**'
            migrations:
              - 'Backend/schema.sql'
              - 'Backend/migrations/**'
              - '.github/workflows/**'

  deploy-migrations:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Ensure D1 Database Exists and Apply Migrations
        run: |
          npx wrangler d1 create react-native-db || true
          DB_ID=$(npx wrangler d1 info react-native-db --json | jq -r '.uuid')
          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          fi
          echo "y" | npx wrangler d1 migrations apply react-native-db --remote
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-backend:
    needs: [detect-changes, deploy-migrations]
    if: always() && (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Auto-Detect D1 Database ID and Deploy Backend
        run: |
          npx wrangler d1 create react-native-db || true
          DB_ID=$(npx wrangler d1 info react-native-db --json | jq -r '.uuid')
          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          fi
          npx wrangler deploy
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Build project
        run: npm run build
      - name: Ensure Pages Project Exists and Deploy Frontend
        run: |
          npx wrangler pages project create react-native-frontend --production-branch main || true
          npx wrangler pages deploy dist --project-name react-native-frontend --branch main
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
